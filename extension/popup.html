<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --blue: #1a73e8;
      --blue-light: #e8f0fe;
      --border: #dadce0;
      --text: #202124;
      --text-muted: #5f6368;
    }
    body {
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      width: 340px;
      padding: 14px;
      background: #ffffff;
      color: var(--text);
      direction: auto;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--blue);
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    select {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-size: 13px;
    }
    select:focus {
      outline: none;
      border-color: var(--blue);
    }
    button {
      padding: 7px 12px;
      margin-right: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      border: 1px solid var(--blue);
      border-radius: 6px;
      background: var(--blue-light);
      color: var(--blue);
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    button:hover {
      background: var(--blue);
      color: #fff;
    }
    #startCcBtn {
      width: 100%;
      background: var(--blue);
      color: #fff;
    }
    #startCcBtn:hover {
      background: #1558b0;
    }
    #signInBtn {
      width: 100%;
      background: #fff;
      border: 2px solid var(--blue);
      color: var(--blue);
      font-weight: 600;
      padding: 8px 12px;
      margin: 0 0 6px 0;
      display: inline-block;
    }
    #signInBtn:hover {
      background: var(--blue-light);
    }
    #signOutBtn {
      border: 1px solid var(--border);
      background: #f1f3f4;
      color: var(--text-muted);
    }
    #signOutBtn:hover {
      background: #e8eaed;
      color: var(--text);
    }
    #authNote {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 14px;
      margin-bottom: 4px;
    }
    #ccStatus {
      font-size: 12px;
      margin-top: 4px;
      color: var(--text-muted);
      min-height: 14px;
    }
    #log {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      margin-bottom: 10px;
      background: #fafbfc;
    }
    #meta {
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .meta-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .meta-row {
      line-height: 1.5;
    }
    .line {
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .speaker {
      font-weight: 600;
      color: var(--blue);
    }
    .live-line {
      color: var(--text-muted);
      font-style: italic;
      opacity: 0.85;
    }
    .live-line .speaker {
      color: var(--text-muted);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
    }
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h3>Meet Transcript</h3>

  <div id="authSection" style="margin-bottom: 4px;">
    <button id="signInBtn">Sign in with Google</button>
    <button id="signOutBtn" style="display: none;">Sign out</button>
    <div id="authNote">Sign in to upload transcripts to your account.</div>
  </div>

  <div style="margin-bottom: 10px;">
    <label for="langSelect">Caption language</label>
    <select id="langSelect">
      <option value="ar-EG">Arabic (Egypt)</option>
      <option value="ar-x-LEVANT">Arabic (Levant)</option>
      <option value="ar-x-GULF">Arabic (Peninsular Gulf)</option>
      <option value="ar-x-MAGHREBI">Arabic (Maghrebi)</option>
      <option value="ar-AE">Arabic (UAE)</option>
      <option value="en-US">English</option>
      <option value="en-GB">English (UK)</option>
      <option value="fr-FR">French</option>
      <option value="es-ES">Spanish (Spain)</option>
      <option value="de-DE">German</option>
    </select>
    <button id="startCcBtn">Turn on Captions in this language</button>
    <div id="ccStatus"></div>
  </div>

  <hr>

  <div id="meta"></div>
  <div id="log">Loading…</div>
  <div class="controls">
    <button id="copyBtn">Copy</button>
    <button id="downloadBtn">Download .txt</button>
    <button id="exportJsonBtn">Export all (.json)</button>
    <button id="clearBtn">Clear</button>
    <button id="syncBtn">Sync Now</button>
  </div>
  <div id="syncStatus" style="font-size: 12px; color: var(--text-muted); margin-top: 4px;"></div>
  <script src="popup.js"></script>
</body>
</html>
